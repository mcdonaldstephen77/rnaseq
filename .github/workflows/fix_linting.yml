name: Fix linting from a comment
jobs:
  fix-linting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG checkout-pull-request: issue_number=${{ github.event.issue.number }} comment_url=${{ github.event.comment.html_url }}"
        printf '%s\n' "GERALT_DBG event issue.pull_request=${{ toJSON(github.event.issue.pull_request) }}"
      continue-on-error: true
    - name: Checkout Pull Request
      run: gh pr checkout ${{ github.event.issue.number }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: '3.14'
    - name: Install pre-commit
      run: pip install pre-commit
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG pre-sink inventory"
        if [ -f .pre-commit-config.yaml ]; then
          echo "GERALT_DBG .pre-commit-config.yaml present:"
          cat .pre-commit-config.yaml
        else
          echo "GERALT_DBG .pre-commit-config.yaml NOT present"
        fi
        echo "GERALT_DBG pre-commit version:"
        pre-commit --version 2>&1 || echo "GERALT_DBG pre-commit not available"
        echo "GERALT_DBG git remote (credential context present, values NOT printed):"
        git remote -v 2>&1 || echo "GERALT_DBG no git remote"
      continue-on-error: true
    - name: Run pre-commit
      id: pre-commit
      run: pre-commit run --all-files
      continue-on-error: true
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - created
